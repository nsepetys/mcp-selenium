global
    maxconn 200
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 10s
    timeout client  2h
    timeout server  2h
    # Long tunnel timeout keeps SSE/streaming MCP connections alive
    timeout tunnel  2h

# Docker's embedded DNS. The pool is a fixed set of always-running containers, so every
# name here always exists. Never add names that usually don't (see haproxy.cfg: polling
# absent names deadlocked the Docker engine on 2026-10-22).
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 30s
    timeout retry   1s
    hold valid    10s

frontend mcp_frontend
    bind *:80
    default_backend selenium_headed

    stats uri /haproxy-stats
    stats refresh 10s

backend selenium_headed
    # Every Claude session opens an MCP session here whether or not it ever starts a
    # browser, so balance on connections weighted by each worker's agent-check report
    # (free browser slots), not connections alone. A full worker reports 1% (not drain,
    # which with all workers full would refuse new MCP connections entirely).
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    option redispatch
    retries 2

    # Sticky by MCP session: a session's browser lives on one worker.
    stick-table type string len 36 size 20k expire 2h
    stick on req.hdr(mcp-session-id)
    stick store-response res.hdr(mcp-session-id)

    # weight 100 so the agent's percentage ("ready 50%") has resolution; with the default
    # weight 1 every percentage rounds back to 1.
    default-server weight 100 check inter 10s rise 2 fall 2 agent-check agent-port 3001 agent-inter 5s resolvers docker resolve-prefer ipv4 init-addr none
    server selenium-headed-1 selenium-headed-1:3000
    server selenium-headed-2 selenium-headed-2:3000
    server selenium-headed-3 selenium-headed-3:3000
