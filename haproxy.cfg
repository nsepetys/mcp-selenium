global
    maxconn 200
    log stdout format raw local0 info
    # Runtime API for the autoscaler (add/del dynamic workers). Not published to the
    # host — reachable only on the compose network.
    stats socket ipv4@0.0.0.0:9999 level admin

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 10s
    timeout client  2h
    timeout server  2h
    # Long tunnel timeout keeps SSE/streaming MCP connections alive
    timeout tunnel  2h

# Docker's embedded DNS, used ONLY for the permanent workers (names that always exist).
# Never point this at names that usually don't exist: with `timeout resolve 1s` and 12
# absent dynamic workers, HAProxy sent dozens of failing lookups per second, dockerd
# logged an error for each, and on 2026-10-22 that flood filled dockerd's stderr pipe and
# deadlocked the whole Docker engine. Dynamic workers are added by the autoscaler through
# the runtime API instead (see autoscaler/index.js).
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 30s
    timeout retry   1s
    hold other    10s
    hold refused  10s
    hold nx       10s
    hold timeout  10s
    hold valid    10s
    hold obsolete 10s

frontend mcp_frontend
    bind *:80
    default_backend selenium_fleet

    # Stats page on /haproxy-stats (internal use)
    stats uri /haproxy-stats
    stats refresh 10s

backend selenium_fleet
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    # If the sticky backend is DOWN, retry on a different healthy backend rather
    # than returning an error to the client. Agents will get "No active browser
    # session" on the new backend and need to call start_browser again — this is
    # preferable to hanging indefinitely on a crashed container.
    option redispatch
    retries 2

    # Sticky sessions: route requests with an existing mcp-session-id to the
    # same backend. On the first request (no header), round-robin picks a node
    # and we capture the session ID from the response header for future routing.
    stick-table type string len 36 size 20k expire 2h
    stick on req.hdr(mcp-session-id)
    stick store-response res.hdr(mcp-session-id)

    # Permanent workers (always running, always in DNS). resolvers docker so HAProxy
    # re-resolves them via Docker DNS after a container recreate; without it HAProxy
    # pins the IP from its own startup and a recreated worker is stranded DOWN.
    server selenium-1  selenium-1:3000  check inter 10s rise 2 fall 2 resolvers docker resolve-prefer ipv4 init-addr none
    server selenium-2  selenium-2:3000  check inter 10s rise 2 fall 2 resolvers docker resolve-prefer ipv4 init-addr none

    # Dynamic workers (selenium-3..N) are NOT declared here. The autoscaler adds and
    # removes them at runtime (`add server` / `del server` on the stats socket) using the
    # container IP from docker inspect, and re-syncs every tick, so an HAProxy restart
    # gets them back within one poll interval.
