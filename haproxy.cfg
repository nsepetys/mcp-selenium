global
    maxconn 200
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 10s
    timeout client  2h
    timeout server  2h
    # Long tunnel timeout keeps SSE/streaming MCP connections alive
    timeout tunnel  2h

# Use Docker's embedded DNS so HAProxy can resolve dynamic container names
# as the autoscaler creates/removes them.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other    10s
    hold refused  10s
    hold nx       10s
    hold timeout  10s
    hold valid    10s
    hold obsolete 10s

frontend mcp_frontend
    bind *:80
    default_backend selenium_fleet

    # Stats page on /haproxy-stats (internal use)
    stats uri /haproxy-stats
    stats refresh 10s

backend selenium_fleet
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    # If the sticky backend is DOWN, retry on a different healthy backend rather
    # than returning an error to the client. Agents will get "No active browser
    # session" on the new backend and need to call start_browser again — this is
    # preferable to hanging indefinitely on a crashed container.
    option redispatch
    retries 2

    # Sticky sessions: route requests with an existing mcp-session-id to the
    # same backend. On the first request (no header), round-robin picks a node
    # and we capture the session ID from the response header for future routing.
    stick-table type string len 36 size 20k expire 2h
    stick on req.hdr(mcp-session-id)
    stick store-response res.hdr(mcp-session-id)

    # Permanent workers (always running, always in DNS). resolvers docker so HAProxy
    # re-resolves them via Docker DNS after a container recreate; without it HAProxy
    # pins the IP from its own startup and a recreated worker is stranded DOWN.
    server selenium-1  selenium-1:3000  check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-2  selenium-2:3000  check inter 10s rise 2 fall 2 resolvers docker init-addr none

    # Dynamic workers — init-addr none so HAProxy doesn't crash at startup when
    # these containers don't exist yet. Docker DNS resolves them once they're created.
    server selenium-3  selenium-3:3000  check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-4  selenium-4:3000  check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-5  selenium-5:3000  check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-6  selenium-6:3000  check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-7  selenium-7:3000  check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-8  selenium-8:3000  check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-9  selenium-9:3000  check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-10 selenium-10:3000 check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-11 selenium-11:3000 check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-12 selenium-12:3000 check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-13 selenium-13:3000 check inter 10s rise 2 fall 2 resolvers docker init-addr none
    server selenium-14 selenium-14:3000 check inter 10s rise 2 fall 2 resolvers docker init-addr none
